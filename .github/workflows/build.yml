name: kmodleak build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build_kmodleak:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        llvm: [17, 18, 19, 20, 21, 22, 23, 24]
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Build container (24.04)
      uses: docker/build-push-action@v7
      with:
        push: false
        build-args: |
          LLVM_VERSION=${{ matrix.llvm }}
          VERSION=24.04
          SHORTNAME=noble
        file: ./.github/docker/Dockerfile.ubuntu
        tags: build_container
    - name: Build kmodleak/src
      run: |
        docker run \
          -v $(pwd):/kmodleak \
          build_container \
          /bin/bash -c \
          'cd /kmodleak/src && make -j`nproc`'
