name: kmodleak build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**/.gitignore'
      - 'LICENSE'
      - '.clang-format'
      - '.github/dependabot.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**/.gitignore'
      - 'LICENSE'
      - '.clang-format'
      - '.github/dependabot.yml'
  workflow_dispatch:

jobs:
  build_kmodleak:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        llvm: [17, 18, 19, 20, 21, 22, 23, 24]
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Build container (24.04)
      uses: docker/build-push-action@v7
      with:
        push: false
        build-args: |
          LLVM_VERSION=${{ matrix.llvm }}
          VERSION=24.04
          SHORTNAME=noble
        file: ./.github/docker/Dockerfile.ubuntu
        tags: build_container
    - name: Build kmodleak/src
      run: |
        docker run \
          -v $(pwd):/kmodleak \
          build_container \
          /bin/bash -c \
          'cd /kmodleak/src && make -j`nproc`'

  # Loading modules and attaching BPF programs needs the runner's own kernel,
  # so this runs on the host rather than in a container.
  test_modules:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Install LLVM 23
      run: wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 23
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libelf-dev zlib1g-dev linux-headers-$(uname -r)
    - name: Build kmodleak
      run: make -C src -j$(nproc) CLANG=clang-23
    - name: Build test modules
      run: make -C mod
    - name: Run module tests
      run: cd mod && ./test.sh
    - name: Show kernel log
      if: failure()
      run: sudo dmesg | tail -n 50
